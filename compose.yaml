services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: praxis
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis_local_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis -d praxis"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - praxis-postgres-data:/var/lib/postgresql/data

volumes:
  praxis-postgres-data:
