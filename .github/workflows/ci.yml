name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: praxis_test
          POSTGRES_PASSWORD: praxis_test
          POSTGRES_DB: praxis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis_test -d praxis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://praxis_test:praxis_test@127.0.0.1:5432/praxis_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:db
      - run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    env:
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
      PRAXIS_SESSION_PEPPER: ci-build-session-pepper-not-a-secret
      PRAXIS_CREDENTIAL_PEPPER: ci-build-credential-pepper-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/sui
            ~/.cargo/git
            ~/.cargo/registry
          key: sui-testnet-1.65.1-${{ runner.os }}
      - name: Install pinned Sui CLI
        run: command -v sui >/dev/null || cargo install --locked --git https://github.com/MystenLabs/sui.git --rev 75515e79e182c37b135a9984c6c1f08a2c383736 sui
      - run: pnpm move:test

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
